<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="یک هدیه کوچک برای یک آدم خاص"
    >

    <title>برای تو ❤️</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <main class="welcome-page">

        <div class="background-glow glow-1"></div>
        <div class="background-glow glow-2"></div>

        <section class="welcome-card">

            <div class="heart-icon" aria-hidden="true">
                ❤️
            </div>

            <p class="small-text">
                یه چیزی برای تو آماده شده...
            </p>

            <h1>
                تولدت مبارک ❤️
            </h1>

            <p class="description">
                شاید فاصله بینمون زیاده،
                ولی امروز دلم می‌خواست یه جوری کنارت باشم.
            </p>

            <button
                id="openGiftButton"
                class="open-button"
                type="button"
            >
                <span>بازش کن</span>
                <span aria-hidden="true">🎁</span>
            </button>

        </section>

    </main>

    <script src="js/main.js"></script>

</body>

</html>
