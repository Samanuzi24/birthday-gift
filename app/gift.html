<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="یک هدیه مخصوص برای تو ❤️"
    >

    <title>یه چیزی برای تو 🎁</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <main class="gift-page">

        <!-- Background -->
        <div class="gift-background"></div>

        <!-- Floating Hearts -->
        <div
            class="floating-hearts"
            aria-hidden="true"
        >
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
        </div>


        <!-- Main Content -->
        <section class="gift-container">

            <p class="gift-small-text">
                یه چیز کوچیک برات آماده کردم...
            </p>

            <h1 class="gift-title">
                فقط برای تو ❤️
            </h1>


            <!-- Gift Box -->
            <div
                class="gift-box-wrapper"
                id="giftBox"
                role="button"
                tabindex="0"
                aria-label="باز کردن کادو"
            >

                <div class="gift-box">

                    <div class="gift-lid">

                        <div class="gift-ribbon-horizontal"></div>

                    </div>

                    <div class="gift-body">

                        <div class="gift-ribbon-vertical"></div>

                    </div>

                </div>

                <div class="gift-shadow"></div>

            </div>


            <p
                class="gift-hint"
                id="giftHint"
            >
                روی کادو بزن 🎁
            </p>


            <!-- Message after opening -->
            <div
                class="gift-message"
                id="giftMessage"
                aria-hidden="true"
            >

                <div class="message-heart">
                    ❤️
                </div>

                <h2>
                    تولدت مبارک عشق من
                </h2>

                <p>
                    این فقط یه کادوی کوچیکه...
                    ولی پشتش کلی حس و حرف هست.
                </p>

                <p class="message-next">
                    ادامه‌ش رو ببین...
                </p>

                <button
                    id="continueButton"
                    class="continue-button"
                    type="button"
                >
                    ادامه ❤️
                </button>

            </div>

        </section>

    </main>


    <!-- Music -->
    <script src="js/music.js"></script>

    <!-- Gift Logic -->
    <script src="js/gift.js"></script>

</body>

</html>
